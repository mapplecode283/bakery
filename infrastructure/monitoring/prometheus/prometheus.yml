global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8761'  # discovery
          - 'host.docker.internal:8090'  # gateway
          - 'host.docker.internal:8081'  # auth
          - 'host.docker.internal:8082'  # customer
          - 'host.docker.internal:8083'  # catalog
          - 'host.docker.internal:8084'  # order
          - 'host.docker.internal:8085'  # payment
          - 'host.docker.internal:8086'  # notification
          - 'host.docker.internal:8087'  # inventory
          - 'host.docker.internal:8088'  # delivery
