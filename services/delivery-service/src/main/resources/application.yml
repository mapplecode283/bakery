server:
  port: 8088

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: mooshi
    password: mooshi123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.mooshi.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          delivery.assigned:com.mooshi.event.DeliveryAssignedEvent,
          delivery.completed:com.mooshi.event.DeliveryCompletedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
