version: '3.9'

services:
  # ============================================================
  # PostgreSQL - Single instance, Database-per-Service pattern
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: mooshi-postgres
    environment:
      POSTGRES_USER: mooshi
      POSTGRES_PASSWORD: mooshi123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooshi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mooshi-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mooshi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mooshi-net

  # ============================================================
  # Zookeeper + Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: mooshi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - mooshi-net

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: mooshi-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - mooshi-net

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: mooshi-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      echo 'Creating Kafka topics...';
      /usr/bin/kafka-topics --create --if-not-exists --topic user.registered --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic order.created --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic order.paid --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic order.completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic payment.completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic payment.failed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic inventory.low --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic delivery.assigned --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      /usr/bin/kafka-topics --create --if-not-exists --topic delivery.completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      echo 'Topics created.';
      "
    networks:
      - mooshi-net

  # ============================================================
  # Zipkin Tracing
  # ============================================================
  zipkin:
    image: openzipkin/zipkin:3
    container_name: mooshi-zipkin
    ports:
      - "9411:9411"
    networks:
      - mooshi-net

  # ============================================================
  # Prometheus + Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mooshi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mooshi-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mooshi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - mooshi-net

networks:
  mooshi-net:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  zookeeper-data:
  kafka-data:
  prometheus-data:
  grafana-data:
